name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public client-side values (safe to embed in the APK).
      # They can be overridden per-repository in Settings > Secrets and variables > Actions > Variables.
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://merry-mole-605.eu-west-1.convex.cloud' }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY || 'BH0m2rZLxhQ4oyBOUXMKDYgIr0RkAlRSl8IJvkM_JNYJlR0d1Lr-nSORuqtdEZ3Nudl3KrITUlkmObN2hGqbDls' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard required build values are present
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::error::VITE_CONVEX_URL is empty. Set it in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$VITE_VAPID_PUBLIC_KEY" ]; then
            echo "::error::VITE_VAPID_PUBLIC_KEY is empty. Set it in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses and install required packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          export PATH="$(dirname "$SDKM"):$PATH"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app (static, same as the Macaly preview)
        run: DEV_BUILD=1 npm run build

      - name: Verify web build output exists
        run: |
          test -f .output/public/index.html || {
            echo "::error::Web build did not produce .output/public/index.html"
            exit 1
          }

      - name: Create Android project (generated during build, not committed)
        run: npx cap add android

      - name: Apply release signing configuration
        run: python3 scripts/apply-signing.py

      - name: Generate app icons and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d2b23' --splashBackgroundColor '#0d2b23'

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Prepare signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/muslim-release.keystore
            {
              echo "storeFile=muslim-release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/keystore.properties
            echo "variant=Release" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore."
          else
            echo "variant=Debug" >> "$GITHUB_OUTPUT"
            echo "Release secrets not set; building a debug APK (fine for personal installs)."
          fi

      - name: Build APK
        run: cd android && ./gradlew "assemble${{ steps.signing.outputs.variant }}" --no-daemon

      - name: Verify APK exists and is non-empty
        run: |
          APK="android/app/build/outputs/apk/${{ steps.signing.outputs.variant == 'Release' && 'release' || 'debug' }}/app-${{ steps.signing.outputs.variant == 'Release' && 'release' || 'debug' }}.apk"
          test -s "$APK" || { echo "::error::APK missing or empty at $APK"; exit 1; }
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muslim-app-${{ steps.signing.outputs.variant == 'Release' && 'release' || 'debug' }}-apk
          path: android/app/build/outputs/apk/${{ steps.signing.outputs.variant == 'Release' && 'release' || 'debug' }}/app-${{ steps.signing.outputs.variant == 'Release' && 'release' || 'debug' }}.apk
          if-no-files-found: error
